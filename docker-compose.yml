# Entorno local de desarrollo. Las credenciales son solo para uso local.
# Los puertos se publican únicamente en 127.0.0.1 (nunca expuestos a la red).
name: charles

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-charles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charles_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-charles}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Fase 14: almacenamiento de imágenes compatible con S3 (en producción, Cloudflare R2).
  # SeaweedFS (Apache 2.0): MinIO dejó de publicar imágenes libres. El backend habla S3 y no
  # depende del proveedor. Credenciales solo locales (docker/seaweedfs/s3.json).
  storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9000}:8333'
    volumes:
      - storage_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres_data:
  redis_data:
  storage_data:
